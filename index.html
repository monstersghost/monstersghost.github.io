<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waifu Hydration</title>
<meta name="referrer" content="no-referrer">
<style>
:root { --bg: #F2F2F7; --card: #FFFFFF; --fg: #1C1C1E; --muted: #6C6C72;
  --accent: #6352C8; --line: #E3E3E8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1C1C1E;
  --fg: #FFFFFF; --muted: #A1A1A8; --accent: #AFA2FF; --line: #353538;
  color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.55 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; }
.card { background: var(--card); border-radius: 18px; padding: 8px 24px 24px; }
h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.01em; margin: 20px 0 6px; }
h2 { font-size: 19px; margin: 28px 0 6px; }
p, li { color: var(--fg); }
.note { color: var(--muted); font-size: 14px; margin-top: 0; }
ul { padding-left: 1.2em; margin: 6px 0; }
li { margin: 4px 0; }
li::marker { color: var(--accent); }
a { color: var(--accent); }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
header img { width: 48px; height: 48px; border-radius: 12px; }
header span { font-weight: 600; }
footer { color: var(--muted); font-size: 14px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<main>
<header><img src="waifu-hydration/icon.png" alt=""><span>Waifu Hydration</span></header>
<div class="card">
<h1>Waifu Hydration</h1><p>A water reminder app for Android with a pixel-art waifu who drinks along with you.</p><ul><li><a href="waifu-hydration/privacy/">Privacy policy</a></li></ul>
</div>
<footer>Waifu Hydration for Android</footer>
</main>
</body>
</html>
